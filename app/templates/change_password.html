{% extends "base.html" %}
{% block title %}Set your password · Gaughan Budget{% endblock %}
{% block content %}
<div class="card" style="max-width:400px; margin: 60px auto; text-align:center;">
  <div style="width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 18px; box-shadow: 0 4px 16px -4px rgba(42,95,214,0.5);">🔑</div>
  <h2 style="margin:0 0 4px; font-size:22px;">Set a new password</h2>
  <p style="color:var(--text-secondary); font-size:14px; margin:0 0 24px;">This is your first login — choose a password only you know.</p>
  <form method="POST" style="max-width:none; text-align:left;">
    <label>New password</label>
    <input type="password" name="new_password" required minlength="8">
    <label>Confirm password</label>
    <input type="password" name="confirm_password" required minlength="8">
    <button type="submit" style="width:100%; margin-top:4px;">Save password</button>
  </form>
</div>
{% endblock %}
