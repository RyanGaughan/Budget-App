databases:
  - name: budget-app-db
    plan: free
    databaseName: budget_app
    user: budget_app

services:
  - type: web
    name: budget-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: budget-app-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SETUP_KEY
        generateValue: true
